<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>مسابقات وتحديات المزهر 🏆 — التحديات والمسابقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Lalezar&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
    --bg1:#0b0e1a; --bg2:#1c1040; --bg3:#2a0f3d;
    --card:rgba(20,16,46,0.72);
    --line:rgba(255,255,255,0.10);
    --txt:#f2f4ff; --muted:rgba(255,255,255,0.55);
    --acc:#ff5630; --gold:#ffd23f; --green:#35c56f; --blue:#2f6bff; --pink:#e879f9;
    --grad-btn:linear-gradient(135deg,#ff5630,#ff7a3c);
    --grad-gold:linear-gradient(135deg,#f7b733,#fc4a1a);
    --grad-violet:linear-gradient(135deg,#7f5af0,#6246ea);
    --shadow:0 14px 50px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    font-family:'Tajawal','Cairo','Segoe UI',Tahoma,sans-serif;
    color:var(--txt); min-height:100vh; direction:rtl;
    background:radial-gradient(1200px 800px at 85% -10%, rgba(124,58,237,.35), transparent 60%),
               radial-gradient(900px 600px at -10% 30%, rgba(255,86,48,.22), transparent 55%),
               radial-gradient(800px 700px at 50% 110%, rgba(47,107,255,.25), transparent 55%),
               linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--acc),var(--pink));border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.mt-1{margin-top:6px}.mt-2{margin-top:12px}.mt-3{margin-top:18px}.mb-1{margin-bottom:6px}.mb-2{margin-bottom:12px}
.container{max-width:820px;margin:0 auto;padding:14px 12px calc(92px + env(safe-area-inset-bottom));}
/* ===== headings ===== */
.fun-title{font-family:'Lalezar','Cairo',sans-serif;font-size:1.7rem;line-height:1.2;letter-spacing:.5px}
.grad-text{background:linear-gradient(90deg,var(--gold),var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
/* ===== glass card ===== */
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card{padding:16px;margin-bottom:14px}
.glow-gold{border-color:rgba(255,210,63,.45);box-shadow:0 0 26px rgba(255,210,63,.16),var(--shadow)}
.glow-red{border-color:rgba(255,86,48,.45);box-shadow:0 0 26px rgba(255,86,48,.18),var(--shadow)}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:12px 18px;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .22s;color:#fff;font-family:inherit;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--grad-btn);box-shadow:0 8px 22px rgba(255,86,48,.35)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-violet{background:var(--grad-violet);box-shadow:0 8px 22px rgba(124,58,237,.35)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 22px rgba(16,185,129,.3)}
.btn-amber{background:var(--grad-gold);color:#221800;box-shadow:0 8px 22px rgba(252,74,26,.3)}
.btn-secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.btn-secondary:hover{background:rgba(255,255,255,.15)}
.btn-danger{background:rgba(244,63,94,.18);border:1px solid rgba(244,63,94,.45);color:#fda4af}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.22)}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm{padding:8px 13px;font-size:.82rem;border-radius:11px}
.btn-xs{padding:5px 10px;font-size:.72rem;border-radius:9px}
.btn-big{padding:14px 26px;font-size:1.05rem;border-radius:16px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ===== inputs ===== */
.input,.select,.textarea{width:100%;padding:12px 14px;border-radius:13px;font-size:.95rem;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);color:#fff;font-family:inherit;outline:none;transition:border-color .2s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--acc);background:rgba(255,255,255,.1)}
.select option,.select optgroup{background:#1c1040;color:#fff}
.textarea{min-height:80px;resize:vertical}
.label{display:block;font-size:.78rem;color:var(--muted);font-weight:800;margin-bottom:6px}
.input-group{margin-bottom:12px}
/* ===== splash ===== */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;transition:opacity .45s;background:radial-gradient(900px 600px at 30% 20%,#3b1d6e,#0b0e1a 65%)}
.splash.hide{opacity:0;pointer-events:none}
.splash img{width:104px;height:104px;border-radius:28px;object-fit:cover;box-shadow:0 0 60px rgba(255,210,63,.45)}
.splash .logo-bounce{animation:bounce 1.8s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.splash h1{font-family:'Lalezar',sans-serif;font-size:2rem;color:#fff}
.splash p{color:var(--muted);font-size:.9rem}
/* ===== login ===== */
.login-wrap{max-width:470px;margin:0 auto;padding:22px 16px;padding-top:6vh}
.logo-circle{width:76px;height:76px;border-radius:24px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:var(--grad-gold);box-shadow:0 0 44px rgba(255,210,63,.5)}
.login-card h2{font-family:'Lalezar',sans-serif;color:#fff;text-align:center;margin-bottom:4px;font-size:1.6rem}
.login-sub{color:var(--muted);font-size:.8rem;text-align:center;margin-bottom:18px}
.role-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.role-tab{padding:9px 13px;border-radius:13px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);font-weight:800;font-size:.8rem;cursor:pointer;transition:all .2s;font-family:inherit}
.role-tab:hover{border-color:var(--acc);color:#fff}
.role-tab.active{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(255,86,48,.4)}
/* ===== topbar ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;z-index:50;background:rgba(11,14,26,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.topbar .logo-sm{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--grad-gold);flex-shrink:0;box-shadow:0 0 18px rgba(255,210,63,.4)}
.topbar .brand-name{color:#fff;font-weight:900;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand-role{color:var(--muted);font-size:.7rem}
/* ===== bottom nav ===== */
.bottom-nav{position:fixed;bottom:0;right:0;left:0;z-index:60;display:flex;justify-content:space-around;align-items:center;background:rgba(15,11,34,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:12px;cursor:pointer;background:none;border:none;font-family:inherit;transition:all .2s}
.nav-item span{font-size:21px;line-height:1}
.nav-item.active{color:var(--gold);background:rgba(255,210,63,.12)}
.nav-item.active span{transform:translateY(-2px)}
/* ===== badges ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:.68rem;font-weight:900;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.badge.open{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.4)}
.badge.ongoing{background:rgba(245,158,11,.2);color:#fcd34d;border:1px solid rgba(245,158,11,.4)}
.badge.done{background:rgba(139,92,246,.25);color:#c4b5fd;border:1px solid rgba(139,92,246,.4)}
.badge.live{background:rgba(255,86,48,.25);color:#ffb3a0;border:1px solid rgba(255,86,48,.5);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,86,48,.4)}50%{box-shadow:0 0 0 6px rgba(255,86,48,0)}}
/* ===== hero ===== */
.hero{text-align:center;padding:26px 16px 20px;position:relative;overflow:hidden}
.hero .cup{width:120px;margin:0 auto 8px;filter:drop-shadow(0 0 30px rgba(255,210,63,.5));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero .hbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;background:rgba(53,197,111,.18);border:1px solid rgba(53,197,111,.4);color:#7ef0b0;font-size:.8rem;font-weight:900;margin-bottom:10px;box-shadow:0 0 16px rgba(53,197,111,.25)}
.hero p{color:var(--muted);font-size:.9rem;line-height:1.8;max-width:520px;margin:8px auto 0}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* ===== section title ===== */
.section-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff;font-weight:900;font-size:1rem;margin-bottom:12px}
.section-title .spacer{flex:1}
.section-title .mini{font-size:.72rem;color:var(--muted);font-weight:700}
/* ===== comp card ===== */
.comp-card{padding:16px;margin-bottom:12px;cursor:pointer;transition:all .22s;position:relative}
.comp-card:hover{border-color:rgba(255,210,63,.5);transform:translateY(-3px)}
.comp-cover{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-bottom:12px;display:block;background:rgba(255,255,255,.06)}
.comp-cover-icon{width:100%;height:110px;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,rgba(255,86,48,.2),rgba(124,58,237,.18))}
.comp-title{color:#fff;font-weight:900;font-size:1.08rem;margin-bottom:4px}
.comp-desc{color:var(--muted);font-size:.82rem;line-height:1.6}
.comp-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.comp-card .quick-actions{display:flex;gap:6px;margin-top:10px}
.comp-card .quick-actions .btn{flex:1}
/* ===== participants ===== */
.part-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:8px}
.home-parts{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.12)}
.part-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--grad-violet);color:#fff;font-weight:900;font-size:.95rem;flex-shrink:0;object-fit:cover;border:2px solid var(--gold)}
.part-info{flex:1;min-width:0}
.part-info .name{color:#fff;font-weight:800;font-size:.88rem}
.part-info .sub{color:var(--muted);font-size:.72rem}
.part-media{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* ===== match / vs ===== */
.match-card{padding:14px;margin-bottom:12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)}
.match-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.match-round{font-size:.7rem;font-weight:900;color:var(--muted)}
.match-status{font-size:.7rem;font-weight:900}
.match-status.wait{color:#fcd34d}.match-status.ok{color:#6ee7b7}
.match-vs{display:flex;align-items:stretch;gap:8px}
.vs-side{flex:1;min-width:0;text-align:center}
.vs-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:1.2rem;margin:0 auto 6px;border:2.5px solid;object-fit:cover}
.vs-a{background:linear-gradient(135deg,#ff5630,#ff7a3c);border-color:#ffb3a0}
.vs-b{background:linear-gradient(135deg,#2f6bff,#6246ea);border-color:#7ad3ff}
.vs-name{color:#fff;font-weight:800;font-size:.78rem;line-height:1.35}
.vs-winner{color:var(--gold);font-weight:900;font-size:.72rem;margin-top:4px;text-shadow:0 0 12px rgba(255,210,63,.5)}
.vs-votes{margin-top:5px;font-size:.7rem;font-weight:800;color:#7ad3ff;background:rgba(47,107,255,.16);border:1px solid rgba(47,107,255,.4);border-radius:20px;padding:3px 10px;display:inline-block}
.vt-box{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);border-radius:14px;padding:8px 12px}
.vt-clock{font-size:1.1rem;animation:pulse 1.2s infinite}
.vt-time{font-family:'Lalezar',sans-serif;font-size:1.35rem;color:var(--gold);letter-spacing:2px;direction:ltr}
.vt-label{font-size:.68rem;color:var(--muted);font-weight:700}
.vt-expired{text-align:center;color:#f43f5e;font-weight:900;font-size:.8rem;margin-top:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.match-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0;padding:0 2px}
.match-mid .vs-label{font-family:'Lalezar',sans-serif;font-size:1.6rem;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* health bar */
.health{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 4px}
.hp{height:9px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.1)}
.hp .fill{height:100%;transition:width .6s ease}
.hp.p1 .fill{background:linear-gradient(90deg,#ff5630,#ff9a4c);border-radius:6px}
.hp.p2 .fill{background:linear-gradient(90deg,#2f6bff,#6fa8ff);border-radius:6px}
.hpbar-labels{display:flex;justify-content:space-between;font-weight:900;font-size:.72rem;margin-top:4px}
.hpbar-labels .a{color:#ff8a5a}.hpbar-labels .b{color:#7ad3ff}
/* vote */
.vote-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vote-row .btn{flex:1;min-width:120px}
.vote-btn{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);color:#fff}
.vote-btn.voted-a{background:rgba(255,86,48,.35);border-color:#ff8a5a}
.vote-btn.voted-b{background:rgba(47,107,255,.35);border-color:#7ad3ff}
.vote-count{text-align:center;color:var(--muted);font-size:.75rem;margin-top:8px;font-weight:700}
/* ===== grid ===== */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mgrid-card{display:flex;flex-direction:column;gap:10px}
.mgrid-card .card-body{flex:1}
.row-line{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:8px}
.row-line .name{color:#fff;font-weight:800;font-size:.86rem}
.row-line .sub{color:var(--muted);font-size:.72rem}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
/* ===== audio player ===== */
.custom-audio-player{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);direction:ltr;min-height:42px;margin:4px 0;max-width:100%}
.custom-audio-player .cap-play{width:34px;height:34px;border-radius:50%;border:none;background:var(--grad-btn);color:#fff;font-size:.8rem;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.custom-audio-player .cap-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);cursor:pointer;position:relative;min-width:0}
.custom-audio-player .cap-prog{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#35c56f,#10b981)}
.custom-audio-player .cap-time{color:rgba(255,255,255,.75);font-size:.68rem;white-space:nowrap;direction:ltr}
.custom-audio-player .cap-dl{width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.13);color:#fff;cursor:pointer;flex:none;font-size:.8rem;display:flex;align-items:center;justify-content:center}
/* ===== media ===== */
.media-thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.09);cursor:pointer;border:1.5px solid rgba(255,255,255,.12)}
.media-link{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;background:rgba(47,107,255,.2);border:1px solid rgba(47,107,255,.4);color:#7ad3ff;font-size:.75rem;font-weight:800;cursor:pointer}
/* ===== modals ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,15,.7);backdrop-filter:blur(6px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:linear-gradient(160deg,#221552,#150b30);border:1px solid rgba(255,255,255,.13);border-radius:24px;max-width:540px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-box h3{font-family:'Lalezar',sans-serif;color:#fff;font-size:1.25rem;margin-bottom:14px}
/* ===== custom video player ===== */
.cplayer{width:100%;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.55)}
.cplayer-stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;line-height:0}
.cplayer-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block;border:none;margin:0}
.cplayer-bigplay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.18);border:none;margin:0;padding:0;transition:opacity .2s ease}
.cplayer-bigplay span{width:74px;height:74px;border-radius:50%;background:rgba(255,63,52,.92);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 6px 26px rgba(0,0,0,.55)}
/* ===== misc ===== */
.empty-state{text-align:center;color:var(--muted);padding:30px 16px;font-size:.9rem}
.text-white-50{color:rgba(255,255,255,.5)}
.divider{height:1px;background:rgba(255,255,255,.09);margin:14px 0}
.check-line{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.05);border-radius:11px;margin-bottom:8px;font-size:.85rem;font-weight:800;color:#fff;cursor:pointer}
.msg{padding:10px 14px;border-radius:13px;font-size:.85rem;font-weight:700;margin-top:10px}
.msg.error{background:rgba(244,63,94,.16);color:#fda4af;border:1px solid rgba(244,63,94,.32)}
.msg.info{background:rgba(99,102,241,.16);color:#a5b4fc;border:1px solid rgba(99,102,241,.32)}
.msg.success{background:rgba(16,185,129,.16);color:#6ee7b7;border:1px solid rgba(16,185,129,.32)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:200;background:rgba(15,11,34,.97);border:1px solid var(--gold);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;font-size:.85rem;box-shadow:0 12px 50px rgba(0,0,0,.55);max-width:90%;text-align:center;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.confetti-piece{position:fixed;top:-20px;z-index:9999;pointer-events:none;animation:confettiFall var(--fall-dur,3s) linear forwards;will-change:transform;opacity:.95}
@keyframes confettiFall{0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:1}100%{transform:translate3d(var(--fall-drift,0px),110vh,0) rotate(760deg);opacity:.55}}
@keyframes champPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.champ-pop{animation:champPop .7s cubic-bezier(.34,1.56,.64,1) both}
/* ===== creative champion celebration ===== */
.crown-float{font-size:4.2rem;animation:crownFloat 2s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,210,63,.7))}
@keyframes crownFloat{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(8deg)}}

function captureVideoCover(file, maxW){
    return new Promise((res)=>{

        const url=URL.createObjectURL(file);
        const v=document.createElement('video');

        function finish(c){
            if(done)return; done=true; URL.revokeObjectURL(url); v.removeAttribute('src'); try{v.load();}catch(e){}

        };
        v.onseeked=function(){

                const h=Math.max(1, Math.round(w*((v.videoHeight||w)/(v.videoWidth||w||w))));

                c.getContext('2d').drawImage(v,0,0,w,h);

}

var MAX_VIDEO_SIZE=32*1024*1024;
function pickVideoMime(){
    const cands=['video/mp4','video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm'];
    if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported)return null;
    for(let i=0;i<cands.length;i++){ if(MediaRecorder.isTypeSupported(cands[i]))return cands[i]; }

}
function encodeVideo(file, bitsPerSec){
    return new Promise((res,rej)=>{
        const mime=pickVideoMime();
        if(!mime||typeof HTMLVideoElement==='undefined'||!document.createElement('video').captureStream){
            rej(new Error('UNSUPPORTED')); return;
        }
        const url=URL.createObjectURL(file);
        const v=document.createElement('video');
        v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url; v.autoplay=true;
        const timer=setTimeout(()=>{ cleanup(); rej(new Error('مهلة الضغط')); }, 15*60*1000);
        let stream=null,rec=null,chunks=[],done=false;
        function cleanup(){
            clearTimeout(timer);
            if(rec&&rec.state!=='inactive'){ try{rec.stop();}catch(e){} }
            if(stream){ stream.getTracks().forEach(t=>t.stop()); }
            URL.revokeObjectURL(url);
        }
        v.onerror=function(){ if(!done){ done=true; cleanup(); rej(new Error('تعذّر تشغيل الفيديو')); } };
        v.onloadedmetadata=function(){
            if(done)return;
            try{
                stream=v.captureStream();
                const opts={ mimeType:mime, videoBitsPerSecond:Math.max(200000,bitsPerSec) };
                rec=new MediaRecorder(stream,opts);
                rec.ondataavailable=e=>{ if(e&&e.data&&e.data.size)chunks.push(e.data); };
                rec.onstop=function(){
                    if(done)return;
                    done=true; clearTimeout(timer);
                    const ext=(mime.indexOf('mp4')>=0)?'mp4':'webm';
                    const blob=new Blob(chunks,{type:mime.split(';')[0]});
                    stream.getTracks().forEach(t=>t.stop());
                    URL.revokeObjectURL(url);
                    if(blob.size>0)res({blob:blob,ext:ext,size:blob.size});
                    else rej(new Error('فشل الضغط — ناتج فارغ'));
                };
                rec.onerror=function(){ if(!done){ done=true; cleanup(); rej(new Error('خطأ في الترميز')); } };
                rec.start(1000);
                v.play().catch(()=>{ if(!done){ done=true; cleanup(); rej(new Error('تعذّر التشغيل')); } });
            }catch(e){ if(!done){ done=true; cleanup(); rej(e); } }
        };
        setTimeout(function(){ if(!done&&rec&&rec.state!=='inactive'&&v.duration&&v.currentTime>=v.duration-0.2)stop(); }, 1000);
        function stop(){ if(done)return; if(rec&&rec.state!=='inactive')rec.stop(); }

    });

function fitVideoForUpload(file){
    return new Promise(async (res,rej)=>{
        if(file.size<=MAX_VIDEO_SIZE){ res({blob:file,ext:file.name.split('.').pop()||'mp4',size:file.size}); return; }
        if(typeof MediaRecorder==='undefined'||!document.createElement('video').captureStream){
            if(file.size>MAX_VIDEO_SIZE+10*1024*1024){ rej(new Error('الضغط غير مدعوم على هذا الجهاز')); return; }
            res({blob:file,ext:file.name.split('.').pop()||'mp4',size:file.size}); return;
        }
        let dur=0;
        try{ dur=await readVideoDuration(file,0); }catch(e){ dur=0; }
        if(!(dur>0)||!isFinite(dur)){ res({blob:file,ext:file.name.split('.').pop()||'mp4',size:file.size}); return; }
        const targetBytes=MAX_VIDEO_SIZE;
        let totalBits=(targetBytes*8)/dur;
        const audioBudget=128*1024;
        let videoBits=Math.max(200000,totalBits-audioBudget);
        let last=null;
        for(let i=0;i<3;i++){
            try{
                const out=await encodeVideo(file,videoBits);
                last=out;
                if(out.size<=MAX_VIDEO_SIZE)break;
                videoBits=Math.round(videoBits*0.7);
            }catch(e){
                if(e.message==='UNSUPPORTED'){ if(file.size>MAX_VIDEO_SIZE+10*1024*1024)rej(new Error('الضغط غير مدعوم على هذا الجهاز')); else res({blob:file,ext:file.name.split('.').pop()||'mp4',size:file.size}); return; }
                if(!last)last=null;
                break;
            }
        }
        if(last)res(last);
        else res({blob:file,ext:file.name.split('.').pop()||'mp4',size:file.size});
    });
}
function fixAudioDataUri(uri){
    if(typeof uri!=='string'||!uri||uri.indexOf('data:')!==0)return uri;
    const comma=uri.indexOf(','); if(comma<0)return uri;
    const head=uri.slice(0,comma); const raw=uri.slice(comma+1).replace(/\s+/g,'');
    if(!/;base64/i.test(head))return uri;
    let ext='';
    try{ const b=atob(raw.substring(0,400)); const c=i=>b.charCodeAt(i);
        if(c(0)===0x1A&&c(1)===0x45&&c(2)===0xDF&&c(3)===0xA3)ext='audio/webm';
        else if(c(4)===0x66&&c(5)===0x74&&c(6)===0x79&&c(7)===0x70)ext='audio/mp4';
        else if(c(0)===0x4F&&c(1)===0x67&&c(2)===0x67&&c(3)===0x53)ext='audio/ogg';
        else if(c(0)===0x49&&c(1)===0x44&&c(2)===0x33)ext='audio/mpeg';
        else if(c(0)===0xFF&&(c(1)&0xE0)===0xE0)ext='audio/mpeg';
        else if(c(0)===0x23&&c(1)===0x21&&c(2)===0x41&&c(3)===0x4D)ext='audio/amr';
        else if(c(0)===0x52&&c(1)===0x49&&c(2)===0x46&&c(3)===0x46)ext='audio/wav';
        else if(c(0)===0x66&&c(1)===0x4C&&c(2)===0x61&&c(3)===0x43)ext='audio/flac';
    }catch(e){return uri;}
    if(!ext)return uri;
    return 'data:'+ext+';base64,'+raw;
}

    audio.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
    const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
    const upd=()=>{ if(audio.duration){ prog.style.width=(audio.currentTime/audio.duration*100)+'%'; time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);} };
    audio.addEventListener('loadedmetadata',upd); audio.addEventListener('timeupdate',upd);
    audio.addEventListener('ended',()=>{btn.innerHTML='▶';});
    audio.addEventListener('play',()=>{btn.innerHTML='⏸';}); audio.addEventListener('pause',()=>{btn.innerHTML='▶';});
    audio.addEventListener('error',()=>{btn.innerHTML='⚠'; time.textContent='تعذّر التشغيل';});
    btn.addEventListener('click',e=>{ e.stopPropagation(); if(audio.paused){const p=audio.play(); if(p&&p.catch)p.catch(()=>{});} else audio.pause(); });
    bar.addEventListener('click',e=>{ e.stopPropagation(); const r=bar.getBoundingClientRect(); if(r.width&&audio.duration)audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration; });
    dl.addEventListener('click',e=>{ e.stopPropagation(); const a=document.createElement('a'); a.href=fixed; a.download='audio'; a.click(); });
    row.appendChild(btn); row.appendChild(bar); row.appendChild(time); row.appendChild(dl); row.appendChild(audio); wrap.appendChild(row);
}

async function doLogin(){
    msgHide('loginMsg');
    const btn=document.querySelector('#loginPage .btn-primary'); btn.disabled=true;
    try{
        if(loginRole==='teacher'){
            const pwd=document.getElementById('loginTeacherPwd').value.trim();
            const snap=await db.ref('config/teacherPassword').once('value');
            if(!pwd||pwd!==(snap.val()||'')){ msg('loginMsg','❌ كلمة المرور غير صحيحة','error'); return; }
            currentUser={role:'teacher',name:'المعلم',key:'teacher'};
        }else if(loginRole==='student'||loginRole==='guardian'){
            const group=document.getElementById('loginGroupSelect').value;
            const pwd=document.getElementById('loginStudentPwd').value.trim();
            if(!group||!pwd){ msg('loginMsg','❌ اختر المجموعة وأدخل الرقم السري','error'); return; }
            const snap=await db.ref('students').orderByChild('group').equalTo(group).once('value');
            let match=null;
            if(snap.exists())snap.forEach(c=>{ const s=c.val(); if(s.password===pwd&&s.status!=='disabled'){ s._key=c.key; match=s; } });
            if(!match){ msg('loginMsg','❌ بيانات غير صحيحة','error'); return; }
            currentUser={role:loginRole,name:match.name,group:match.group,studentNumber:match.studentNumber,_key:match._key,phone:match.phone||'',photo:match.photo||'',password:match.password};
        }else if(loginRole==='judge'){
            const name=document.getElementById('loginJudgeName').value.trim();
            const secret=document.getElementById('loginJudgeSecret').value.trim();
            if(!name||!secret){ msg('loginMsg','❌ أدخل الاسم والرقم السري','error'); return; }
            const snap=await db.ref('communityJudges').once('value');
            let found=null,foundKey=null;
            if(snap.exists())snap.forEach(child=>{ const j=child.val(); if(j.name===name&&j.secret===secret&&j.active!==false){ found=j; foundKey=child.key; } });
            if(!found){ msg('loginMsg','❌ المحكم غير موجود أو الرقم السري خاطئ','error'); return; }
            currentUser={role:'judge',name:found.name,key:foundKey};
        }else if(loginRole==='assistant'){
            const pwd=document.getElementById('loginAssistantPwd').value.trim();
            if(!pwd){ msg('loginMsg','❌ أدخل كلمة المرور','error'); return; }
            const snap=await db.ref('assistants').once('value');
            let found=null,foundKey=null;
            if(snap.exists())snap.forEach(child=>{ const a=child.val(); if(a.password===pwd&&a.active!==false){ found=a; foundKey=child.key; } });
            if(!found){ msg('loginMsg','❌ المساعد غير موجود أو الحساب غير نشط','error'); return; }
            currentUser={role:'assistant',name:found.name||'مساعد',key:foundKey};
        }else if(loginRole==='external'){
            let phone=document.getElementById('loginExternalPhone').value.trim();
            if(!phone){ msg('loginMsg','❌ أدخل رقم الهاتف','error'); return; }
            phone=phone.replace(/\D/g,'');
            if(phone.length<8){ msg('loginMsg','❌ رقم الهاتف غير صالح','error'); return; }
            const esnap=await db.ref('communityExternals/'+phone).once('value');
            let ext=esnap.val();
            if(!ext){
                const name=document.getElementById('loginExternalName').value.trim();
                if(!name){ document.getElementById('extNameGroup').classList.remove('hidden'); msg('loginMsg','✍️ أنت تدخل أول مرة — اكتب اسمك','info'); return; }
                ext={name,phone,at:Date.now()};
                await db.ref('communityExternals/'+phone).set(ext);
                document.getElementById('loginExternalName').value='';
            }
            currentUser={role:'external',name:ext.name,phone};
        }
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        enterApp();
        startGlobalVoteTimer();
        enforceVoteTimers();
    }catch(e){ msg('loginMsg','❌ حدث خطأ: '+(e.message||e),'error'); }
    finally{ btn.disabled=false; }
}

function renderVote(){
    const body=document.getElementById('appBody');
    body.innerHTML='<div class="glass card"><div class="fun-title grad-text">🗳️ ساحة التصويت</div><div class="comp-desc mt-1">شاهد المشاركات وصوّت لأقوى منافس — كل مباراة بضغطة</div></div>';
    const list=document.createElement('div'); list.id='voteList'; list.className='mt-2'; body.appendChild(list);
    if(voteRef){ voteRef.off('value'); voteRef=null; }
    voteRef=db.ref('communityComps').orderByChild('status').startAt('running').endAt('running');
    voteRef.on('value',snap=>{
        const cont=document.getElementById('voteList'); if(!cont||currentUser==null)return;
        const sy=window.scrollY||0;
        cont.innerHTML='';
        if(!snap.exists()){ cont.innerHTML='<div class="glass card empty-state">لا توجد مباريات مفتوحة حالياً 🔒</div>'; return; }
        let shown=0, tint=0;
        snap.forEach(child=>{
            const c=child.val(); c.id=child.key;
            if(c.archived)return;
            if(!compVoteScope(c))return;
            const rounds=c.rounds||{};
            const cr=c.currentRound;
            const r=rounds[cr];
            if(!r)return;
            const keys=Object.keys(r).filter(mid=>!r[mid].bye).filter(mid=>isAdmin()||!r[mid].resolved);
            if(!keys.length)return;
            const head=document.createElement('div'); head.className='glass card';
            head.innerHTML='<div class="section-title">'+escapeHtml(c.title||'')+' <div class="spacer"></div><span class="badge '+(roundVotingOpen(c)?'live':'done')+'">'+roundLabel(c,cr)+' — '+(roundVotingOpen(c)?'🗳️ التصويت مفتوح':'🔒 مغلق')+'</span></div>'+voteTimerHTML(c);
            cont.appendChild(head);
            keys.forEach(mid=>{
                const card=voteCard(c,cr,mid,r[mid]);
                card.classList.add('tint-'+((tint%3)+1)); tint++;
                cont.appendChild(card);
                maybeCelebrateMatch(c,cr,mid,r[mid]);
                shown++;
            });
        });
        if(!shown)cont.innerHTML='<div class="glass card empty-state">لا توجد مباريات مفتوحة للتصويت الآن 🔒</div>';
        attachMediaSlots();
        if(sy>0)requestAnimationFrame(()=>window.scrollTo(0,sy));
    });
}

    const card=document.createElement('div'); card.className='glass comp-card battle-card';
    const cc=countVotes(m);
    const isStaff=isAdmin()||currentUser.role==='judge';
    const reveal=isStaff||m.resolved;
    const total=reveal?cc.a+cc.b:0;
    const pa=total?Math.round(cc.a/total*100):50, pb=total?Math.round(cc.b/total*100):50;
    const banner=stageBanner(c,rn);
    const winA=(m.resolved&&m.decided==='a');
    const winB=(m.resolved&&m.decided==='b');
    const sideA=battleSide(c,m.a,winA,cc.a);
    const sideB=battleSide(c,m.b,winB,cc.b);
    card.innerHTML=banner+voteTimerHTML(c)+
    '<div class="match-head"><span class="badge '+(m.votingOpen?'live':'done')+'">⚡ التصويت '+(m.votingOpen?'مفتوح':'مغلق')+'</span><span class="badge">'+(reveal?'❤️ '+total:'🔒')+'</span></div>'+
    '<div class="match-vs" style="align-items:flex-start">'+sideA+
    '<div class="match-mid"><span class="vs-label">VS</span></div>'+sideB+'</div>'+
    '<div class="battle-tag">النتيجة ولعانة 🔥 صوتك ممكن يقلب المواجهة… ادخل احسمها!</div>'+
    '<div class="health"><div class="hp p1"><div class="fill" style="width:'+pa+'%"></div></div><div class="hp p2"><div class="fill" style="width:'+pb+'%"></div></div></div>'+
    '<div class="hpbar-labels"><span class="a">'+(reveal?pa+'%':'؟')+'</span><span class="b">'+(reveal?pb+'%':'؟')+'</span></div>'+
    battleCTA(c,rn,mid,m);
    return card;
}

function renderMap(){

    const list=document.createElement('div'); list.id='mapList'; list.className='mt-2'; body.appendChild(list);
    db.ref('communityComps').once('value',snap=>{

        cont.innerHTML='';
        if(!snap.exists()){ cont.innerHTML='<div class="glass card empty-state">لا توجد مسابقات</div>'; return; }
        snap.forEach(child=>{
            const c=child.val(); c.id=child.key;
            if(c.archived&&!isAdmin())return;
            if(!compInScope(c))return;
            cont.appendChild(bracketCard(c));
        });
        if(!cont.children.length)cont.innerHTML='<div class="glass card empty-state">لا توجد مسابقات متاحة</div>';

}
function bracketCard(c){
    const card=document.createElement('div'); card.className='glass card';
    const st=c.status==='open'?'<span class="badge open">🟢 مفتوحة</span>':c.status==='running'?'<span class="badge live">⚔️ تُجرى</span>':'<span class="badge done">🏁 انتهت</span>';
    let rounds='';
    const rmap=c.rounds||{};
    Object.keys(rmap).sort((a,b)=>Number(a)-Number(b)).forEach(rn=>{
        const r=rmap[rn];
        const rlabel=roundLabel(c,rn);
        rounds+='<div class="bracket-round"><div class="rlabel">'+rlabel+'</div>';
        Object.keys(r).forEach(mid=>{
            const m=r[mid];
            const a=escapeHtml(currentStudentsFullName(c,(m.a||{}).sn));
            const b=m.bye?'تلقائي':escapeHtml(currentStudentsFullName(c,(m.b||{}).sn));
            const w=m.decided?escapeHtml(currentStudentsFullName(c,(m[m.decided]||{}).sn)):null;
            rounds+='<div class="bracket-match"><span class="pname">'+a+'</span><span style="color:var(--muted);font-weight:900;font-size:.7rem">vs</span><span class="pname">'+b+'</span>'+(w?'<span class="w">🏅 '+w+'</span>':(m.resolved?'<span class="w">✅</span>':''))+'</div>';
        });
        rounds+='</div>';
    });
    if(!rounds)rounds='<div class="empty-state" style="padding:10px">لم تُكوّن المواجهات بعد</div>';
    card.innerHTML='<div class="section-title">'+escapeHtml(c.title||'')+' <div class="spacer"></div>'+st+'</div>'+rounds+
    (c.champion?'<div class="mt-2" style="text-align:center;padding:10px;border-radius:14px;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35)"><b style="color:var(--gold);font-size:1rem">🏆 البطل: '+escapeHtml(c.champion.name)+'</b></div>':'');
    card.onclick=()=>{ routeCompFrom='map'; routeView='comp'; routeCompId=c.id; renderNav(); renderRoute(); };
    card.style.cursor='pointer';
    return card;
}

async function syncParticipantPhoto(url){
    if(!currentUser.studentNumber)return;

            upd[child.key+'/participants/'+currentUser.studentNumber+'/photo']=url;
        }
    });

async function saveNewComp(){
    const title=document.getElementById('ncTitle').value.trim();
    if(!title){ msg('ncMsg','❌ أدخل عنوان المسابقة','error'); return; }
    const desc=document.getElementById('ncDesc').value.trim();
    const groups=Array.from(document.querySelectorAll('.nc-scope:checked')).map(c=>c.value);
    const mediaTypes={}; Array.from(document.querySelectorAll('.nc-media:checked')).forEach(c=>mediaTypes[c.value]=true);
    if(!mediaTypes.image&&!mediaTypes.audio&&!mediaTypes.link&&!mediaTypes.video){ msg('ncMsg','❌ اختر نوع وسيط واحد على الأقل','error'); return; }
    const file=document.getElementById('ncCover').files[0];
    let cover='';
    if(file){ msg('ncMsg','⏳ رفع الغلاف...','info'); try{ cover=await uploadImage(file); }catch(e){ msg('ncMsg','❌ فشل رفع الغلاف (سيكمل بدون)','error'); } }
    const ref=db.ref('communityComps').push();
    await ref.set({ title,desc,groups,mediaTypes,cover,status:'open',createdAt:Date.now(),createdBy:currentUser.name, participants:{}, rounds:{}, currentRound:0, champion:null, allowNewSubmission:false, judgedNotice:false });
    if(groups.length){ groups.forEach(g=>notifyGroupStudents(g,'🏆 مسابقة جديدة: '+title,'من مسابقات وتحديات المزهر — ارفع اشتراكك في صفحة مسابقات وتحديات المزهر الآن!')); }
    else { db.ref('students').once('value',snap=>{ snap.forEach(c=>{ const s=c.val(); notifyStudent(s.group,s.studentNumber,'🏆 مسابقة جديدة: '+title,'انضم وارفع مشاركتك الآن!'); }); }); }
    showToast('✅ أُنشئت مسابقة جديدة');
    broadcastAnnounce({kind:'reg',compId:ref.key,title,at:Date.now()});
    queueAnnounce({kind:'reg',kicker:'مسابقة جديدة 🔥',title,sub:'تم فتح باب المشاركة — سجّل وارفع مشاركتك الآن!',msg:'🎯 ارفع مشاركتك بصوت أو صورة أو رابط، واصنع بصمتك.'});
    routeView='comp'; routeCompId=ref.key; renderNav(); renderRoute();
}

// ===== COMP DETAIL =====
function renderComp(compId){
    if(compRefPath){ db.ref(compRefPath).off('value'); compRefPath=null; compRefHandle=null; }
    compRefPath='communityComps/'+compId;
    const body=document.getElementById('appBody');
    body.innerHTML='<div class="empty-state">⏳ جاري التحميل...</div>';
    compRefHandle=snap=>{
        if(!currentUser)return;
        const b=document.getElementById('appBody');
        if(!snap.exists()){ b.innerHTML='<button class="btn btn-secondary btn-sm" onclick="routeView=\'home\';renderNav();renderRoute()">🔙</button><div class="empty-state">المسابقة غير موجودة</div>'; return; }
        const c=snap.val(); c.id=compId;
        renderCompHTML(b,c);
    };
    db.ref(compRefPath).on('value',compRefHandle);
}
function renderCompHTML(body,c){
    const pcount=c.participants?Object.keys(c.participants).length:0;
    const st=c.status==='open'?'<span class="badge open">🟢 مفتوحة</span>':c.status==='running'?'<span class="badge live">⚔️ تُجرى الآن</span>':'<span class="badge done">🏁 انتهت</span>';
    const header='<button class="btn btn-secondary btn-sm mb-2" onclick="routeView=\'home\';routeCompId=null;renderNav();renderRoute()">🔙 القائمة</button>'+
    '<div class="glass card">'+
    (c.cover?'<img class="comp-cover" src="'+escapeHtml(c.cover)+'" />':'<div class="comp-cover-icon">🏆</div>')+
    '<div class="comp-title">'+escapeHtml(c.title||'')+' '+st+(c.archived?' <span class="badge done">📦 مؤرشفة</span>':'')+'</div>'+
    (c.desc?'<div class="comp-desc mt-1">'+escapeHtml(c.desc)+'</div>':'')+
    '<div class="comp-meta"><span class="badge">👥 '+pcount+' متسابق</span>'+
    (c.currentRound?'<span class="badge">🌀 الجولة '+(c.currentRound||0)+'</span>':'')+
    (c.champion?'<span class="badge ongoing">🏆 البطل: '+escapeHtml(c.champion.name||'')+'</span>':'')+
    '</div>'+voteTimerHTML(c)+'</div>';
    let html=header;
    if(c.status==='finished'&&c.champion){
        html+='<div class="glass card glow-gold" style="text-align:center">'+
        '<div style="font-size:3rem">🏆</div>'+
        '<div class="fun-title mb-2" style="color:#fff">البطل: '+escapeHtml(c.champion.name)+'</div>'+
        champMedia(c.champion)+'</div>';
        const ck='champCelebrated_'+c.id;
        if(!localStorage.getItem(ck)){ localStorage.setItem(ck,'1'); setTimeout(()=>celebrateChampion(c.champion.name,c.title,c.champion),700); }
    }
    if(c.status==='running'&&c.roundNotice&&c.roundNotice.rn===c.currentRound){
        const rk='roundNoticeSeen_'+c.id+'_'+c.currentRound;
        if(!localStorage.getItem(rk)){
            html+='<div class="glass card" id="roundNoticeBox" style="border:2px solid var(--gold);background:linear-gradient(135deg,rgba(255,210,63,.18),rgba(255,86,48,.12))">'+
            '<div class="fun-title grad-text" style="font-size:1.1rem">'+(c.roundNotice.msg||('🎬 بدأت الجولة '+(c.currentRound)))+'</div>'+
            '<div class="comp-desc mt-1">شاهد المواجهات بالأسفل، واذهب لتبويب «صوّت» للتصويت فور فتحه. صوّت بضغطة واحدة! 🗳️</div>'+
            '<button class="btn btn-primary btn-sm mt-1" onclick="dismissRoundNotice(\''+escapeHtml(rk)+'\')">فهمت ✓</button></div>';
        }
    }
    if(!isAdmin())html+=guidanceBar(c);
    let grid='<div class="mgrid">';
    grid+='<div class="glass card mgrid-card"><div class="section-title">📝 مشاركتك <div class="spacer"></div><span class="badge">👥 '+(c.participants?Object.keys(c.participants).length:0)+' متسابق</span></div><div class="card-body"><div class="actions-row">'+mySubmitArea(c)+'</div><div class="text-white-50" style="font-size:.78rem;margin-top:6px">قائمة المشاركين تظهر من الصفحة الرئيسية</div></div></div>';
    grid+='<div class="glass card mgrid-card"><div class="section-title">⚔️ المواجهات</div><div class="card-body"><div id="matchList"></div></div></div>';
    html+=grid+'</div>';
    if(isAdmin())html+=judgesPanelHTML(c);
    html+=teacherPanelHTML(c);
    body.innerHTML=html;
    renderMatches(c);
    initJudges(c);
    attachMediaSlots();
    // reveal animation
    body.querySelectorAll('.reveal').forEach((el,i)=>setTimeout(()=>el.classList.add('show'),40*i));
}
function dismissRoundNotice(key){
    localStorage.setItem(key,'1');
    const box=document.getElementById('roundNoticeBox');
    if(box)box.remove();
}
function guidanceBar(c){
    const st=c.status;
    const step=(n,txt,on)=>'<div style="flex:1;min-width:120px;text-align:center;padding:10px 8px;border-radius:12px;font-weight:700;background:'+(on?'linear-gradient(135deg,var(--acc),#ff8a3d);color:#fff;box-shadow:0 4px 14px rgba(255,86,48,.35)':'rgba(255,255,255,.06);color:var(--muted)')+'">'+txt+'</div>';
    let s1=true,s2=false,s3=false;
    if(st==='running'){ s1=false; s2=true; }
    if(st==='finished'){ s1=false; s2=false; s3=true; }
    return '<div class="glass card"><div class="section-title">🧭 كيف أشارك؟ <div class="spacer"></div><span class="badge ongoing">دليل بسيط</span></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
    step(1,'١ ارفع مشاركتك',s1)+
    '<span style="color:var(--muted)">→</span>'+
    step(2,'٢ صوّت للمنافسين',s2)+
    '<span style="color:var(--muted)">→</span>'+
    step(3,'٣ شاهد النتيجة',s3)+
    '</div></div>';
}
function mySubmitArea(c){
    if(currentUser.role!=='student')return '';
    const inScope=!c.groups||!c.groups.length||c.groups.indexOf(currentUser.group)!==-1;
    if(!inScope)return '';
    if(c.status!=='open'&&!c.allowNewSubmission)return '';
    const sn=currentUser.studentNumber;
    const mine=c.participants&&c.participants[sn];
    if(c.status!=='open'){
        if(!mine||!mine.needNew)return '';
    }
    const label=mine?(c.allowNewSubmission?'🔁 ارفع مشاركتك الجديدة (مطلوبة للصعود)':'📝 تعديل مشاركتي'):'🆕 ارفع مشاركتك';
    return '<button class="btn btn-primary btn-sm" onclick="openSubModal(\''+escapeHtml(c.id)+'\')">'+label+'</button>'+
        (mine&&c.status==='open'?' <button class="btn btn-danger btn-sm" onclick="deleteMyPart(\''+escapeHtml(c.id)+'\')">🗑️</button>':'');
}
function renderParticipants(c,containerId){
    const box=document.getElementById(containerId||'partList'); if(!box)return;
    box.innerHTML='';
    const parts=c.participants||{};
    const keys=Object.keys(parts);
    if(!keys.length){ box.innerHTML='<div class="empty-state" style="padding:16px">لا يوجد مشاركون بعد</div>'; return; }
    keys.sort((x,y)=>{ const a=parts[x],b=parts[y]; const da=a&&a.needNew?1:0, db2=b&&b.needNew?1:0; return da-db2; });
    keys.forEach(k=>{
        const p=parts[k];
        const row=document.createElement('div'); row.className='part-row';
        let actions='';
        if(isAdmin()){
            actions='<div class="actions-row" style="flex-wrap:nowrap">'+
            '<button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();editParticipantMedia(\''+escapeHtml(c.id)+'\',\''+escapeHtml(k)+'\')">✏️</button>'+
            '<button class="btn btn-danger btn-xs" onclick="event.stopPropagation();removeParticipant(\''+escapeHtml(c.id)+'\',\''+escapeHtml(k)+'\')">🗑️</button></div>';
        }
        row.innerHTML=avatarHTML(p)+
        '<div class="part-info"><div class="name">'+escapeHtml(p.name||'')+'</div>'+
        '<div class="sub">'+escapeHtml(p.group||'')+(p.needNew?' • رفع جديد مطلوب':'')+'</div></div>'+
        '<div class="part-media">'+mediaLockHTML(c,k)+'</div>'+actions;
        box.appendChild(row);
    });
    attachMediaSlots();
}
// ===== media render =====
function renderPlayer(url, cover){
    let u=(url||'').trim();
    if(!u)return '<span class="text-white-50">—</span>';
    let id='';
    if(u.indexOf('drive.google.com')>=0||u.indexOf('drive.usercontent.google.com')>=0){
        const m1=u.match(/\/file\/d\/([^/?#]+)/); if(m1)id=m1[1];
        if(!id){ const m2=u.match(/[?&]id=([^&]+)/); if(m2)id=m2[1]; }
        if(!id)return '<a class="media-link" href="'+escapeHtml(u)+'" target="_blank" rel="noopener">🔗 فتح الفيديو</a>';
        u='https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';
    }
    const thumb=cover||(id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w800':'');
    return '<div class="vid-thumb" data-vplay="'+escapeHtml(u)+'" data-vposter="'+escapeHtml(thumb)+'" style="position:relative;width:100%;max-width:460px;cursor:pointer;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000">'+
        (thumb?'<img src="'+escapeHtml(thumb)+'" alt="thumbnail" style="width:100%;height:100%;object-fit:cover;display:block" />':'')+
        '<span style="position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(255,63,52,.85);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45)">▶</span>'+
        '</div>';
}
function openVideoModal(src, poster){
    const o=document.createElement('div'); o.className='modal-overlay';
    const isDrive=(src.indexOf('drive.google.com')>=0||src.indexOf('drive.usercontent.google.com')>=0);
    let id='';
    if(isDrive){
        const m1=src.match(/\/file\/d\/([^/?#]+)/); if(m1)id=m1[1];
        if(!id){ const m2=src.match(/[?&]id=([^&]+)/); if(m2)id=m2[1]; }
    }
    const maxW=isDrive?820:780;
    const post=(poster?' poster="'+escapeHtml(poster)+'"':'');
    o.innerHTML='<div class="modal-box" style="text-align:center;max-width:'+maxW+'px;width:100%">'+
        '<div class="cplayer">'+
            '<div class="cplayer-stage">'+
                (poster?'<img src="'+escapeHtml(poster)+'" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:1" />':'')+
                '<video class="cplayer-video" playsinline preload="metadata"'+post+'></video>'+
                '<button type="button" class="cplayer-bigplay"><span>▶</span></button>'+
            '</div>'+
        '</div>'+
        '<button class="btn btn-secondary btn-sm mt-2">✕ إغلاق</button></div>';
    document.body.appendChild(o);
    const stage=o.querySelector('.cplayer-stage');
    const v=o.querySelector('.cplayer-video');
    const big=o.querySelector('.cplayer-bigplay');
    const bigSpan=big.querySelector('span');
    let ready=false, failed=false;
    const fmtState=function(){ bigSpan.textContent=(!ready)?'⌛':(v.paused?'▶':'⏸'); big.style.opacity=(ready&&!v.paused)?0:1; };
    const attempts=[];
    if(isDrive&&id){
        attempts.push('https://drive.google.com/uc?id='+encodeURIComponent(id));
        attempts.push('https://drive.google.com/uc?export=open&id='+encodeURIComponent(id));
        attempts.push('IFRAME');
    }else if(isDrive){
        attempts.push(src);
    }else{
        attempts.push(src);
    }
    let ai=0;
    const tryNext=function(){
        if(failed)return;
        if(ai>=attempts.length){ failed=true; showToast('تعذر تشغيل الفيديو'); return; }
        const a=attempts[ai++];
        if(a==='IFRAME'){
            stage.innerHTML='<iframe src="'+escapeHtml('https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview')+'" allow="autoplay; fullscreen; encrypted-media" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block" title="مشغل الفيديو"></iframe>';
            return;
        }
        ready=false; fmtState();
        try{ v.removeAttribute('src'); v.load(); }catch(_){}
        v.src=a;
    };
    big.addEventListener('click',function(e){ e.stopPropagation(); if(!ready){ showToast('جاري التحميل…'); return; } if(v.paused){ v.play().catch(function(){ if(failed)showToast('تعذر تشغيل الفيديو'); }); } else { try{ v.pause(); }catch(_){} } });
    v.addEventListener('play',function(){ ready=true; fmtState(); });
    v.addEventListener('pause',function(){ fmtState(); });
    v.addEventListener('loadedmetadata',function(){ ready=true; fmtState(); });
    v.addEventListener('error',tryNext);
    tryNext();

    const close=function(){ try{ v.pause(); }catch(_){} o.remove(); };
    o.querySelector('.btn').onclick=close;
    o.onclick=function(e){ if(e.target===o)close(); };
}
function singleMedia(m){
    if(!m)return '<span class="text-white-50">بدون محتوى</span>';
    if(m.type==='image'&&m.url)return '<img class="media-thumb" data-img="'+escapeHtml(m.url)+'" src="'+escapeHtml(m.url)+'" />';
    if(m.type==='audio'&&m.audio)return '<div data-audio="'+escapeHtml(m.audio)+'" style="min-width:150px"></div>';
    if(m.type==='link'){
        const lu=(m.url||'').trim();
        if(lu&&(lu.indexOf('drive.google.com')>=0||lu.indexOf('drive.usercontent.google.com')>=0||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(lu))){
            return renderPlayer(lu, m.cover);
        }
        return '<a class="media-link" href="#" onclick="openExternal(\''+escapeHtml((m.url||'').replace(/'/g,"\\'"))+'\');return false;">🔗 فتح الرابط</a>'+(m.cover?'<div class="mt-1"><img class="media-thumb" data-img="'+escapeHtml(m.cover)+'" src="'+escapeHtml(m.cover)+'" /></div>':'');
    }
    if(m.type==='video'&&m.url)return renderPlayer(m.url, m.cover);
    return '<span class="text-white-50">—</span>';
}
function partMedia(p){
    const m=p&&p.media; if(!m)return '';
    if(m.type==='image'&&m.url)return '<div data-link="'+escapeHtml(m.url)+'" data-img="'+escapeHtml(m.url)+'" style="cursor:pointer"><img class="media-thumb" data-img="'+escapeHtml(m.url)+'" src="'+escapeHtml(m.url)+'" /></div>';
    if(m.type==='audio'&&m.audio)return '<div data-audio="'+escapeHtml(m.audio)+'"></div>';
    if(m.type==='link')return '<span class="text-white-50">🔗 رابط</span>';
    return '';
}
function openExternal(url){
    if(!url){ showToast('لا يوجد رابط'); return; }
    try{ window.open(url,'_blank'); }catch(e){ showToast('❌ تعذّر فتح الرابط'); }
}
function roundVotingOpen(c){
    if(c.status!=='running')return false;
    const r=c.rounds&&c.rounds[c.currentRound];
    if(!r)return false;
    for(const mid in r){ if(r[mid]&&r[mid].votingOpen===true)return true; }
    return false;
}
function canSeeMedia(c,sn){
    if(isAdmin()||currentUser.role==='judge')return true;
    if(sn===currentUser.studentNumber)return true;
    if(roundVotingOpen(c))return true;
    return false;
}
function mediaLockHTML(c,sn){
    const has=c.participants&&c.participants[sn]&&c.participants[sn].media;
    if(!has)return '';
    if(canSeeMedia(c,sn))return singleMedia(c.participants[sn].media);
    const lock=c.status==='open'?'🔒 الوسائط تظهر بعد غلق التسجيل وفتح التصويت':'🔒 الوسائط تظهر عند فتح التصويت';
    return '<button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();showToast(\''+lock+'\')">🔒 مخفي</button>';
}
function attachMediaSlots(){
    document.querySelectorAll('[data-audio]').forEach(el=>{
        const uri=el.getAttribute('data-audio'); el.removeAttribute('data-audio');
        attachAudioPlayer(el,uri);
    });
    document.querySelectorAll('[data-img]').forEach(el=>{
        const src=el.getAttribute('data-img'); el.removeAttribute('data-img');
        el.onclick=e=>{ e.stopPropagation(); showLightbox(src); };
    });
    document.querySelectorAll('[data-link]').forEach(el=>{
        const src=el.getAttribute('data-link'); el.removeAttribute('data-link');
        el.onclick=e=>{ e.stopPropagation(); openExternal(src); };
    });
    document.querySelectorAll('[data-vplay]').forEach(el=>{
        const src=el.getAttribute('data-vplay'); const pst=el.getAttribute('data-vposter')||''; el.removeAttribute('data-vplay');
        el.onclick=e=>{ e.stopPropagation(); openVideoModal(src, pst); };
    });
}
function showLightbox(url){
    const o=document.createElement('div'); o.className='modal-overlay';
    o.innerHTML='<div class="modal-box" style="text-align:center"><img src="'+escapeHtml(url)+'" style="max-width:100%;border-radius:14px" /><button class="btn btn-secondary btn-sm mt-2">✕ إغلاق</button></div>';
    o.querySelector('button').onclick=()=>o.remove();
    o.onclick=e=>{ if(e.target===o)o.remove(); };
    document.body.appendChild(o);
}
function champMedia(ch){
    if(!ch||!ch.media)return '';
    const m=ch.media;
    const wrap='<div style="max-width:300px;margin:10px auto 0">';
    if(m.type==='image'&&m.url)return wrap+'<img data-img="'+escapeHtml(m.url)+'" src="'+escapeHtml(m.url)+'" style="width:100%;height:auto;border-radius:14px;border:1px solid rgba(255,210,63,.35);cursor:pointer" /></div>';
    if(m.type==='audio'&&m.audio)return wrap+'<div data-audio="'+escapeHtml(m.audio)+'"></div></div>';
    if(m.type==='link'&&m.url){
        const lu=(m.url||'').trim();
        if(lu.indexOf('drive.google.com')>=0||lu.indexOf('drive.usercontent.google.com')>=0||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(lu)){
            return wrap+renderPlayer(lu, m.cover)+'</div>';
        }
        return wrap+'<button class="btn btn-amber btn-sm" onclick="event.stopPropagation();openExternal(\''+escapeHtml(m.url.replace(/'/g,"\\'"))+'\')">🔗 فتح وسيلة البطل</button>'+(m.cover?'<div class="mt-1"><img data-img="'+escapeHtml(m.cover)+'" src="'+escapeHtml(m.cover)+'" style="width:100%;height:auto;border-radius:14px;cursor:pointer" /></div>':'')+'</div>';
    }
    if(m.type==='video'&&m.url)return wrap+renderPlayer(m.url, m.cover)+'</div>';
    return '';
}
// ===== matches & voting =====
function roundLabel(c,rn){
    const rnN=Number(rn);
    const mcount=Object.keys(c.rounds[rn]||{}).length;
    if(mcount===1)return 'النهائي 🔥';
    if(mcount===2)return 'نصف النهائي 💥';
    if(mcount===4)return 'ربع النهائي ⚔️';
    if(mcount===8)return 'دور الـ16 🎯';
    if(mcount===16)return 'دور الـ32 🚀';
    return rnN===1?'الجولة الأولى':rnN===2?'الجولة الثانية':rnN===3?'الجولة الثالثة':'الجولة '+rnN;
}
function stageBanner(c,rn){
    const stage=roundLabel(c,rn);
    if(stage==='النهائي 🔥')return '<div class="battle-banner final-banner">👑 النهائي الكبير — لحظة الحسم، كل شيء أو لا شيء! 🔥</div>';
    if(stage==='نصف النهائي 💥')return '<div class="battle-banner semi-banner">💥 نصف النهائي — خطوة تفصلك عن المجد!</div>';
    if(stage==='ربع النهائي ⚔️')return '<div class="battle-banner quarter-banner">⚔️ ربع النهائي — كل مواجهة صاعقة!</div>';
    if(stage==='دور الـ16 🎯')return '<div class="battle-banner sixteen-banner">🎯 دور الـ16 — القوة تتكشف الآن!</div>';
    return '<div class="battle-banner">⚡ أعنف مواجهة في البطولة — دلوقتي</div>';
}
function renderMatches(c){
    const box=document.getElementById('matchList'); if(!box)return;
    box.innerHTML='';
    const rounds=c.rounds||{};
    let any=false;
    const isStaff=isAdmin()||currentUser.role==='judge';
    const keys=Object.keys(rounds).sort((a,b)=>Number(a)-Number(b));
    let tint=0;
    if(!isStaff&&c.status==='running'){
        const cr=String(c.currentRound);
        if(rounds[cr]){

async function announceChampion(compId){
    showToast('⏳ جاري تجهيز إعلان البطل...');

        const snap=await db.ref('communityComps/'+compId).once('value');

        if(!winner){ showToast('⚠️ احسم النهائي أولاً — صوّت وأغلق التصويت'); return; }
        await declareChampion(compId,c,winner);
        showToast('👑 أُعلن البطل ووصل الاحتفاء للجميع! 🎉');
    }catch(e){
        console.error('announceChampion',e);
        showToast('❌ تعذّر الإعلان: '+(e.message||e));
    }
}
function findCurrentWinner(c){
    const r=c.rounds&&c.rounds[c.currentRound];
    if(!r)return null;
    let winner=null, count=0;
    Object.keys(r).forEach(mid=>{
        const m=r[mid];
        if(m.bye){ return; }
        if(m.decided){ const w=m[m.decided]; if(w&&w.sn){ winner=w.sn; count++; } }
    });
    if(count===1)return winner;
    const wins=currentRoundWinners(c);
    return wins.length===1?wins[0]:null;
}

async function voteTimerTick(){
    if(!currentUser)return;
    db.ref('communityComps').orderByChild('status').equalTo('running').once('value',snap=>{
        if(!snap.exists())return;
        snap.forEach(child=>{
            const c=child.val(); c.id=child.key;
            if(!c.voteDeadline||!c.voteTimerRunning)return;
            document.querySelectorAll('[data-vtimer="'+c.id+'"]').forEach(el=>{
                const left=c.voteDeadline-Date.now();
                if(left<=0){
                    el.innerHTML='<div class="vt-expired">⏰ انتهى وقت التصويت!</div>';
                    if(!voteTimerClosed[c.id]){
                        voteTimerClosed[c.id]=true;
                        closeRoundVoting(c.id,c.currentRound).then(()=>{
                            db.ref('communityComps/'+c.id).update({voteDeadline:null,voteTimerRunning:false});
                            showToast('⏰ انتهى وقت التصويت وحُسِبت النتائج');
                        });
                    }
                    return;
                }
                const s=Math.floor(left/1000), mm=Math.floor(s/60), ss=s%60;
                el.innerHTML='<div class="vt-box"><span class="vt-clock">⏳</span><span class="vt-time">'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'</span><span class="vt-label">متبقي على التصويت</span></div>';
                if(left<=3000)el.querySelector('.vt-clock').style.color='#f43f5e';
            });
        });
    });
}

async function closeRoundVoting(compId,rn){
    const snap=await db.ref('communityComps/'+compId+'/rounds/'+rn).once('value');
    if(!snap.exists())return;
    const upd={}; const pending=[];
    snap.forEach(child=>{
        const m=child.val();
        upd['rounds/'+rn+'/'+child.key+'/votingOpen']=false;
        if(m&&!m.resolved&&!m.bye){
            const cc=countVotes(m);
            if(cc.a>0||cc.b>0){
                if(cc.a>cc.b){ upd['rounds/'+rn+'/'+child.key+'/decided']='a'; upd['rounds/'+rn+'/'+child.key+'/resolved']=true; }
                else if(cc.b>cc.a){ upd['rounds/'+rn+'/'+child.key+'/decided']='b'; upd['rounds/'+rn+'/'+child.key+'/resolved']=true; }
                else pending.push(child.key);
            }
        }
    });
    await db.ref('communityComps/'+compId).update(upd);
    if(pending.length)showToast('🤝 تعادل في '+pending.length+' مباراة — ينتظر القرار اليدوي');
    else showToast('✅ أُغلق التصويت وحُسِبت النتائج');
}

async function closeRegistration(compId){
    const snap=await db.ref('communityComps/'+compId).once('value');
    if(!snap.exists())return;
    const c=snap.val();
    if(c.status!=='open'){ showToast('المسابقة لم تعد مفتوحة'); return; }
    const parts=c.participants||{};
    const keys=Object.keys(parts);
    if(keys.length<2){ showToast('❌ يجب وجود متسابقين على الأقل'); return; }
    const pool=shuffle(keys);
    const round={}; let mi=0;
    for(let i=0;i<pool.length;i+=2){
        mi++; const id='m'+mi;
        round[id]={ a:{sn:pool[i]}, bye:false, votes:{}, decided:null, resolved:false };
        if(i+1<pool.length)round[id].b={sn:pool[i+1]};
        else { round[id].bye=true; round[id].decided='a'; round[id].resolved=true; }
    }
    const notice={rn:1,msg:'🎬 بدأت المسابقة! الجولة الأولى — شاهد المواجهات وصوّت',at:Date.now()};
    await db.ref('communityComps/'+compId).update({status:'running',currentRound:1,rounds:{1:round},allowNewSubmission:false,roundNotice:notice});
    showToast('✅ أُغلِق التسجيل ونُظّمت المواجهات');
}
async function buildNextRound(compId,c,wins){
    const n=(c.currentRound||0)+1;
    const round={}; let mi=0;
    for(let i=0;i<wins.length;i+=2){
        mi++; const id='m'+mi;
        round[id]={ a:{sn:wins[i]}, bye:false, votes:{}, decided:null, resolved:false };
        if(i+1<wins.length)round[id].b={sn:wins[i+1]};
        else { round[id].bye=true; round[id].decided='a'; round[id].resolved=true; }
    }
    const notice={rn:n,msg:(n===2?'🎬 بدأت الجولة الثانية — شاهد المواجهات وصوّت':'🎬 بدأت الجولة '+(arNum(n))),at:Date.now()};
    await db.ref('communityComps/'+compId).update({ ['rounds/'+n]:round, currentRound:n, roundNotice:notice });
}
function arNum(n){ return n===2?'الثانية':n===3?'الثالثة':n===4?'الرابعة':''+n; }
async function maybeAdvance(compId){
    const snap=await db.ref('communityComps/'+compId).once('value');
    const c=snap.val(); if(!c||c.status!=='running')return;
    const cr=c.currentRound; const round=c.rounds&&c.rounds[cr];
    if(!round)return;
    const wins=[]; let allResolved=true;
    Object.keys(round).forEach(mid=>{
        const m=round[mid];
        if(m.resolved){ const w=m.decided?m[m.decided]:null; if(w&&w.sn)wins.push(w.sn); }
        else allResolved=false;
    });
    if(!allResolved)return;
    if(wins.length===1){ showToast('👑 انتهت البطولة — اضغط «إعلان البطل» من لوحة التحكم'); return; }
    if(wins.length===4&&!c.allowNewSubmission){
        const upd={}; wins.forEach(s=>{ upd['participants/'+s+'/needNew']=true; });
        await db.ref('communityComps/'+compId).update(upd);
        await db.ref('communityComps/'+compId).update({allowNewSubmission:true});
        showToast('🕓 تأهل الأربعة — يجب على كل واحد رفع مشاركة جديدة قبل نصف النهائي');
        return;
    }
    await buildNextRound(compId,c,wins);
    showToast('🔄 انتقلت للجولة '+(c.currentRound+1));
}
async function gateSemifinal(compId){
    const snap=await db.ref('communityComps/'+compId).once('value');
    const c=snap.val(); if(!c)return;
    const round=c.rounds&&c.rounds[c.currentRound]; if(!round)return;
    const wins=[];
    Object.keys(round).forEach(mid=>{ const m=round[mid]; if(m.resolved){ const w=m[m.decided]; if(w&&w.sn)wins.push(w.sn); } });
    const missing=wins.filter(k=>{ const p=c.participants&&c.participants[k]; return !p||p.needNew||!p.media; });
    if(wins.length!==4){ showToast('لم يتأهل أربعة بعد'); return; }
    if(missing.length){ showToast('⚠️ لم يرفع بعد: '+(missing.map(k=>(c.participants&&c.participants[k]&&c.participants[k].name)||k).join('، '))); return; }
    await db.ref('communityComps/'+compId).update({allowNewSubmission:false});
    await buildNextRound(compId,c,wins);
    showToast('🎬 بدأت الجولة: نصف النهائي');
}

async function manualAdvance(compId){
    const snap=await db.ref('communityComps/'+compId).once('value');
    const c=snap.val(); if(!c||c.status!=='running')return;
    const cr=c.currentRound; const round=c.rounds&&c.rounds[cr]; if(!round)return;
    if(anyUnresolved(c)){ showToast('⚠️ توجد مباريات غير محسومة'); return; }
    const wins=[];
    Object.keys(round).forEach(mid=>{ const m=round[mid]; if(m.resolved){ const w=m.decided?m[m.decided]:null; if(w&&w.sn)wins.push(w.sn); } });
    if(wins.length===1){ showToast('👑 انتهت البطولة — اضغط «إعلان البطل» من لوحة التحكم'); return; }
    if(wins.length===4&&!c.allowNewSubmission){
        const upd={}; wins.forEach(s=>{ upd['participants/'+s+'/needNew']=true; });
        await db.ref('communityComps/'+compId).update(upd);
        await db.ref('communityComps/'+compId).update({allowNewSubmission:true});
        showToast('🕓 تأهل الأربعة — ارفع كل واحد مشاركة جديدة ثم اضغط "بدء نصف النهائي"');
        return;
    }
    await buildNextRound(compId,c,wins);
    showToast('🔄 شُكّلت الجولة '+(c.currentRound+1));
}

function toggleSubRec(){
    if(isRecording){ stopSubRec(); return; }
    if(recAudioData){ recAudioData=null; document.getElementById('nsRecPreview').innerHTML=''; }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showToast('❌ التسجيل غير مدعوم في متصفحك'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
        micStream=st;
        mediaRecorder=new MediaRecorder(st);
        chunks=[];
        isRecording=true;
        mediaRecorder.ondataavailable=e=>{ if(e.data&&e.data.size)chunks.push(e.data); };
        mediaRecorder.onstop=()=>{
            const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});
            const fr=new FileReader();
            fr.onload=()=>{
                recAudioData=fixAudioDataUri(fr.result);
                const p=document.getElementById('nsRecPreview'); if(p)attachAudioPlayer(p,recAudioData);
            };
            fr.readAsDataURL(blob); chunks=[];
            if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
            mediaRecorder=null;
        };
        mediaRecorder.start();
        document.getElementById('nsRecBtn').innerHTML='⏹️ إنهاء التسجيل';
        document.querySelector('#nsRecBtn').style.background='rgba(244,63,94,0.25)';
        recTimeSec=0; document.getElementById('nsRecTime').textContent='0:00';
        recTimer=setInterval(()=>{ recTimeSec++; const el=document.getElementById('nsRecTime'); if(el)el.textContent=Math.floor(recTimeSec/60)+':'+String(recTimeSec%60).padStart(2,'0'); },1000);
        showToast('🎙️ جارٍ التسجيل...');
    }).catch(()=>showToast('❌ تعذّر الوصول للميكروفون'));
}
function stopSubRec(noMessage){
    if(isRecording&&mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
    isRecording=false;
    clearInterval(recTimer);
    const b=document.getElementById('nsRecBtn'); if(b)b.innerHTML='⏺️ ابدأ التسجيل'; if(b)b.style.background='';
    if(noMessage)return;
    const preview=document.getElementById('nsRecPreview'); if(preview&&!recAudioData&&chunks.length)showToast('🎙️ استمع للتسجيل ثم أرسل');
}

async function submitNewSubmission(){
    msgHide('nsMsg');
    if(!_nsComp){ return; }
    if(_nsBehalf){ if(!isAdmin()){ msg('nsMsg','❌ غير مسموح','error'); return; } }
    else if(!currentUser||currentUser.role!=='student'){ msg('nsMsg','❌ المشاركة متاحة للطلاب فقط','error'); return; }
    const type=document.getElementById('nsMediaType').value;
    let media=null;
    if(type==='image'){
        const f=document.getElementById('nsImageFile').files[0];
        if(!f){ msg('nsMsg','❌ اختر صورة','error'); return; }
        msg('nsMsg','⏳ رفع الصورة إلى السحابة...','info');
        try{ const url=await uploadImage(f); media={type:'image',url}; }
        catch(e){ msg('nsMsg','❌ فشل رفع الصورة','error'); return; }
    }else if(type==='audio'){
        if(!recAudioData){ msg('nsMsg','❌ سجّل صوتك أولاً','error'); return; }
        media={type:'audio',audio:recAudioData};
    }else if(type==='link'){
        const url=document.getElementById('nsLinkUrl').value.trim();
        if(!url){ msg('nsMsg','❌ أدخل الرابط','error'); return; }
        let cover='';
        const cf=document.getElementById('nsLinkFile').files[0];
        if(cf){ msg('nsMsg','⏳ رفع صورة الغلاف...','info'); try{ cover=await uploadImage(cf); }catch(e){ msg('nsMsg','⚠️ فشل رفع الغلاف (نكمل بدونها)','error'); } }
        media={type:'link',url,cover};
    }else if(type==='video'){
        const f=document.getElementById('nsVideoFile').files[0];
        if(!f){ msg('nsMsg','❌ اختر ملف فيديو','error'); return; }
        let dur=0;
        try{ dur=await readVideoDuration(f,3000); }catch(e){ dur=0; }
        if(videoMaxSec>0&&dur>videoMaxSec){
            msg('nsMsg','⏱️ مدة الفيديو '+formatDur(dur)+' تتجاوز الحد المسموح ('+formatDur(videoMaxSec)+')','error');
            return;
        }
        let useFile=f, useExt=null;
        if(f.size>MAX_VIDEO_SIZE){
            msg('nsMsg','⏳ الفيديو كبير — جارٍ ضغطه ليتناسب (قد يستغرق ما يعادل مدة الفيديو)...','info');
            try{
                const fit=await fitVideoForUpload(f);
                useFile=fit.blob; useExt=fit.ext;
            }catch(e){
                msg('nsMsg','❌ '+((e&&e.message)||e),'error'); return;
            }
            if(useExt&&useExt!=='mp4'&&useExt!=='webm')useExt='mp4';
        }
        if(typeof File==='undefined'||!(useFile instanceof File)){
            try{ useFile=new File([useFile],'vid'+(Date.now())+'.'+(useExt||'mp4'),{type:useExt==='webm'?'video/webm':'video/mp4'}); }catch(e){}
        }
        msg('nsMsg','⏳ تجهيز صورة مصغرة للفيديو...','info');
        let cover=null;
        try{ const cb=await captureVideoCover(useFile,420); if(cb){ cover=await uploadImage(cb); } }catch(e){}
        msg('nsMsg','⏳ رفع الفيديو إلى درايف (قد يستغرق دقيقة)...','info');
        let url=null;
        try{ url=await uploadVideo(useFile); }
        catch(e){ msg('nsMsg','❌ فشل رفع الفيديو: '+(e.message||e),'error'); return; }
        media={type:'video',url};
        if(cover)media.cover=cover;
        else{
            let fid='';
            if(url.indexOf('drive.google.com')>=0||url.indexOf('drive.usercontent.google.com')>=0){
                const m1=url.match(/\/file\/d\/([^/?#]+)/); if(m1)fid=m1[1];
                if(!fid){ const m2=url.match(/[?&]id=([^&]+)/); if(m2)fid=m2[1]; }
            }
            if(fid)media.cover='https://drive.google.com/thumbnail?id='+encodeURIComponent(fid)+'&sz=w800';
        }
    }
    const sn=_nsBehalf?_nsBehalf.sn:currentUser.studentNumber;
    const name=_nsBehalf?_nsBehalf.name:currentUser.name;
    const group=_nsBehalf?_nsBehalf.group:currentUser.group;
    const photo=currentUser.photo||(_nsBehalf?'':'');
    const entry={name,group,media,needNew:false};
    if(photo)entry.photo=photo;
    try{ await db.ref('communityComps/'+_nsComp.id+'/participants/'+sn).set(entry); }
    catch(e){ msg('nsMsg','❌ '+(e.message||e),'error'); return; }
    closeNsModal();
    showToast('✅ رُفعت المشاركة بنجاح');
}
function nsMediaChanged(type){
    document.getElementById('nsBlockImage').classList.toggle('hidden',type!=='image');
    document.getElementById('nsBlockAudio').classList.toggle('hidden',type!=='audio');
    document.getElementById('nsBlockLink').classList.toggle('hidden',type!=='link');
    document.getElementById('nsBlockVideo').classList.toggle('hidden',type!=='video');
    const pre=document.getElementById('nsPreview');
    if(type==='image'){
        const f=document.getElementById('nsImageFile').files[0];
        if(!f){ pre.innerHTML=''; return; }
        const fr=new FileReader(); fr.onload=()=>{ pre.innerHTML='<img src="'+fr.result+'" style="width:100%;border-radius:12px" />'; }; fr.readAsDataURL(f);
    }else if(type==='audio'){
        pre.innerHTML='<span class="text-white-50">🎤 سجّل الصوت وستظهر سماعته هنا</span>';
    }else if(type==='link'){
        pre.innerHTML='<span class="text-white-50">🔗 أدخل الرابط واختر صورة الغلاف (اختياري)</span>';
    }else{
        pre.innerHTML='<span class="text-white-50">🎬 اختر ملف الفيديو وسيُرفع مباشرة عند الإرسال</span>';
    }
}
// ===== boot =====
window.addEventListener('load', () => {
    db.ref('config/teacherPassword').once('value', snap => {
        if (!snap.exists()) db.ref('config/teacherPassword').set('1234').catch(()=>{});
    });
});
